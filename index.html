<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>CurrículoPro</title>
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --bg:#0f172a; --panel:#1a2436; --panel2:#141d2e; --border:#2a3549;
    --text:#e2e8f0; --muted:#94a3b8; --accent:#f59e0b; --accent2:#fb923c;
    --danger:#ef4444; --ok:#22c55e;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text)}
  header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;background:var(--panel2);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
  header h1{font-size:18px;margin:0;display:flex;align-items:center;gap:8px}
  header h1 span{color:var(--accent)}
  .btn{background:var(--accent);color:#1a1204;border:none;padding:9px 14px;border-radius:8px;font-weight:600;cursor:pointer;font-size:13px;display:inline-flex;align-items:center;gap:6px;transition:.15s}
  .btn:hover{background:var(--accent2)}
  .btn.secondary{background:var(--panel);color:var(--text);border:1px solid var(--border)}
  .btn.secondary:hover{background:#20293d}
  .btn.small{padding:6px 10px;font-size:12px}
  .btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
  .layout{display:grid;grid-template-columns:1fr;gap:0}
  @media(min-width:980px){.layout{grid-template-columns:1fr 1fr}}
  .form-col{padding:18px;max-width:640px;margin:0 auto;width:100%}
  .preview-col{background:#0b1220;padding:18px;display:flex;justify-content:center;align-items:flex-start}
  .section{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px}
  .section h2{font-size:14px;text-transform:uppercase;letter-spacing:.5px;color:var(--accent);margin:0 0 12px 0;display:flex;justify-content:space-between;align-items:center}
  label{font-size:12px;color:var(--muted);display:block;margin:8px 0 4px}
  input,textarea,select{width:100%;background:var(--panel2);border:1px solid var(--border);border-radius:7px;padding:9px 10px;color:var(--text);font-size:14px;font-family:inherit}
  textarea{resize:vertical;min-height:60px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .item-block{border:1px dashed var(--border);border-radius:9px;padding:12px;margin-bottom:10px;position:relative}
  .item-block .remove{position:absolute;top:8px;right:8px}
  .tag-input{display:flex;gap:8px;margin-bottom:8px}
  .tag-input input{flex:1}
  .tags{display:flex;flex-wrap:wrap;gap:6px}
  .tag{background:#26314a;border:1px solid var(--border);padding:5px 10px;border-radius:20px;font-size:12px;display:flex;align-items:center;gap:6px}
  .tag button{background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px;padding:0}
  .foot-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}

  /* PREVIEW / CV STYLING */
  #cvPage{background:#fff;color:#1a1a1a;width:210mm;min-height:297mm;padding:14mm 14mm;box-shadow:0 4px 24px rgba(0,0,0,.4);font-size:11px;line-height:1.45}
  #cvPage .cv-header{border-bottom:3px solid var(--accent);padding-bottom:10px;margin-bottom:14px}
  #cvPage h1{margin:0;font-size:24px;color:#0f172a}
  #cvPage .role{color:var(--accent2);font-weight:600;font-size:13px;margin-top:2px}
  #cvPage .contacts{display:flex;flex-wrap:wrap;gap:12px;font-size:10.5px;color:#444;margin-top:8px}
  #cvPage .cv-section{margin-bottom:12px}
  #cvPage .cv-section h3{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:#0f172a;border-bottom:1px solid #ddd;padding-bottom:3px;margin:0 0 8px 0}
  #cvPage .entry{margin-bottom:8px}
  #cvPage .entry .row{display:flex;justify-content:space-between;font-weight:600;font-size:11.5px}
  #cvPage .entry .sub{color:#555;font-size:10.5px;font-style:italic;margin-bottom:2px}
  #cvPage .entry p{margin:2px 0 0 0;color:#333}
  #cvPage .skill-tags{display:flex;flex-wrap:wrap;gap:6px}
  #cvPage .skill-tags span{background:#f1f5f9;border:1px solid #ddd;padding:3px 9px;border-radius:12px;font-size:10px}
  @media print{
    body *{visibility:hidden}
    #cvPage,#cvPage *{visibility:visible}
    #cvPage{position:absolute;top:0;left:0;box-shadow:none;width:100%}
  }
  .install-banner{display:none;background:#1e293b;border:1px solid var(--accent);padding:10px 16px;font-size:13px;align-items:center;justify-content:space-between;gap:10px}
  .install-banner.show{display:flex}
  .empty-hint{color:var(--muted);font-size:10.5px;font-style:italic}
  ::-webkit-scrollbar{width:8px}
  ::-webkit-scrollbar-thumb{background:#334;border-radius:4px}
</style>
</head>
<body>

<header>
  <h1>Currículo<span>Pro</span></h1>
  <div class="foot-actions">
    <button class="btn secondary small" id="clearBtn">🗑 Limpar</button>
    <button class="btn small" id="exportBtn">⬇ Exportar PDF</button>
  </div>
</header>

<div class="install-banner" id="installBanner">
  <span>📲 Instale o CurrículoPro no seu dispositivo para usar offline.</span>
  <button class="btn small" id="installBtn">Instalar</button>
</div>

<div class="layout">
  <div class="form-col">

    <div class="section">
      <h2>Dados Pessoais</h2>
      <div class="grid2">
        <div><label>Nome completo</label><input id="f_nome" placeholder="Ex: João da Silva"></div>
        <div><label>Cargo / Área desejada</label><input id="f_cargo" placeholder="Ex: Engenheiro Agrônomo"></div>
      </div>
      <div class="grid2">
        <div><label>E-mail</label><input id="f_email" type="email" placeholder="voce@email.com"></div>
        <div><label>Telefone</label><input id="f_telefone" placeholder="(00) 00000-0000"></div>
      </div>
      <div class="grid2">
        <div><label>Cidade / Estado</label><input id="f_local" placeholder="São Luís, MA"></div>
        <div><label>LinkedIn / Portfólio</label><input id="f_link" placeholder="linkedin.com/in/..."></div>
      </div>
      <div class="grid2">
        <div><label>Idade</label><input id="f_idade" type="number" min="0" placeholder="Ex: 28"></div>
        <div><label>CNH</label><input id="f_cnh" placeholder="Ex: AB"></div>
      </div>
      <label>Escolaridade</label>
      <select id="f_escolaridade">
        <option value="">Selecione...</option>
        <option>Ensino Fundamental Incompleto</option>
        <option>Ensino Fundamental Completo</option>
        <option>Ensino Médio Incompleto</option>
        <option>Ensino Médio Completo</option>
        <option>Ensino Técnico</option>
        <option>Ensino Superior Incompleto</option>
        <option>Ensino Superior Completo</option>
        <option>Pós-graduação</option>
        <option>Mestrado</option>
        <option>Doutorado</option>
      </select>
      <label>Resumo profissional</label>
      <textarea id="f_resumo" placeholder="Breve resumo sobre sua trajetória e objetivos..."></textarea>
    </div>

    <div class="section">
      <h2>Experiência Profissional <button class="btn small secondary" id="addExp">+ Adicionar</button></h2>
      <div id="expList"></div>
    </div>

    <div class="section">
      <h2>Formação Acadêmica <button class="btn small secondary" id="addEdu">+ Adicionar</button></h2>
      <div id="eduList"></div>
    </div>

    <div class="section">
      <h2>Cursos e Certificações <button class="btn small secondary" id="addCourse">+ Adicionar</button></h2>
      <div id="courseList"></div>
    </div>

    <div class="section">
      <h2>Habilidades</h2>
      <div class="tag-input">
        <input id="skillInput" placeholder="Ex: Excel, Agricultura de Precisão..." onkeydown="if(event.key==='Enter'){event.preventDefault();window.addSkill();}">
        <button class="btn small secondary" onclick="window.addSkill()">Adicionar</button>
      </div>
      <div class="tags" id="skillTags"></div>
    </div>

    <div class="section">
      <h2>Idiomas</h2>
      <div class="tag-input">
        <input id="langInput" placeholder="Ex: Inglês - Intermediário" onkeydown="if(event.key==='Enter'){event.preventDefault();window.addLang();}">
        <button class="btn small secondary" onclick="window.addLang()">Adicionar</button>
      </div>
      <div class="tags" id="langTags"></div>
    </div>

  </div>

  <div class="preview-col">
    <div id="cvPage">
      <div class="cv-header">
        <h1 id="p_nome">Seu Nome</h1>
        <div class="role" id="p_cargo" style="display:none"></div>
        <div class="contacts" id="p_contacts"></div>
      </div>

      <div class="cv-section" id="p_resumoSection">
        <h3>Resumo</h3>
        <p id="p_resumo" style="margin:0;color:#333"></p>
      </div>

      <div class="cv-section" id="p_expSection">
        <h3>Experiência Profissional</h3>
        <div id="p_expList"></div>
      </div>

      <div class="cv-section" id="p_eduSection">
        <h3>Formação Acadêmica</h3>
        <div id="p_eduList"></div>
      </div>

      <div class="cv-section" id="p_courseSection">
        <h3>Cursos e Certificações</h3>
        <div id="p_courseList"></div>
      </div>

      <div class="cv-section" id="p_skillSection">
        <h3>Habilidades</h3>
        <div class="skill-tags" id="p_skillTags"></div>
      </div>

      <div class="cv-section" id="p_langSection">
        <h3>Idiomas</h3>
        <div class="skill-tags" id="p_langTags"></div>
      </div>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'curriculopro_data_v1';

function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {
    nome:'', cargo:'', email:'', telefone:'', local:'', link:'', idade:'', cnh:'', escolaridade:'', resumo:'',
    exp:[], edu:[], courses:[], skills:[], langs:[]
  };
}

let data = loadData();
if(!Array.isArray(data.courses)) data.courses = [];

function save(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  renderPreview();
}

// ---------- Personal fields ----------
const personalIds = ['nome','cargo','email','telefone','local','link','idade','cnh','escolaridade','resumo'];
personalIds.forEach(id=>{
  const el = document.getElementById('f_'+id);
  el.value = data[id] || '';
  const evt = el.tagName==='SELECT' ? 'change' : 'input';
  el.addEventListener(evt, ()=>{ data[id]=el.value; save(); });
});

// ---------- Experience ----------
function renderExpForm(){
  const list = document.getElementById('expList');
  list.innerHTML = '';
  if(data.exp.length===0){
    list.innerHTML = '<p class="empty-hint">Nenhuma experiência adicionada ainda.</p>';
  }
  data.exp.forEach((item, idx)=>{
    const block = document.createElement('div');
    block.className='item-block';
    block.innerHTML = `
      <button class="btn danger small remove" data-idx="${idx}" data-type="exp">✕</button>
      <label>Cargo</label><input data-field="cargo" data-idx="${idx}" value="${escapeAttr(item.cargo||'')}">
      <div class="grid2">
        <div><label>Empresa</label><input data-field="empresa" data-idx="${idx}" value="${escapeAttr(item.empresa||'')}"></div>
        <div><label>Período</label><input data-field="periodo" data-idx="${idx}" placeholder="Jan/2022 - Atual" value="${escapeAttr(item.periodo||'')}"></div>
      </div>
      <label>Descrição das atividades</label>
      <textarea data-field="descricao" data-idx="${idx}">${escapeHtml(item.descricao||'')}</textarea>
    `;
    list.appendChild(block);
  });
  attachItemHandlers('exp');
}

function renderEduForm(){
  const list = document.getElementById('eduList');
  list.innerHTML = '';
  if(data.edu.length===0){
    list.innerHTML = '<p class="empty-hint">Nenhuma formação adicionada ainda.</p>';
  }
  data.edu.forEach((item, idx)=>{
    const block = document.createElement('div');
    block.className='item-block';
    block.innerHTML = `
      <button class="btn danger small remove" data-idx="${idx}" data-type="edu">✕</button>
      <label>Curso</label><input data-field="curso" data-idx="${idx}" value="${escapeAttr(item.curso||'')}">
      <div class="grid2">
        <div><label>Instituição</label><input data-field="instituicao" data-idx="${idx}" value="${escapeAttr(item.instituicao||'')}"></div>
        <div><label>Período</label><input data-field="periodo" data-idx="${idx}" placeholder="2018 - 2022" value="${escapeAttr(item.periodo||'')}"></div>
      </div>
    `;
    list.appendChild(block);
  });
  attachItemHandlers('edu');
}

function renderCourseForm(){
  const list = document.getElementById('courseList');
  list.innerHTML = '';
  if(data.courses.length===0){
    list.innerHTML = '<p class="empty-hint">Nenhum curso adicionado ainda.</p>';
  }
  data.courses.forEach((item, idx)=>{
    const block = document.createElement('div');
    block.className='item-block';
    block.innerHTML = `
      <button class="btn danger small remove" data-idx="${idx}" data-type="courses">✕</button>
      <label>Nome do curso</label><input data-field="nome" data-idx="${idx}" value="${escapeAttr(item.nome||'')}">
      <div class="grid2">
        <div><label>Instituição</label><input data-field="instituicao" data-idx="${idx}" value="${escapeAttr(item.instituicao||'')}"></div>
        <div><label>Ano / Carga horária</label><input data-field="periodo" data-idx="${idx}" placeholder="2023 - 40h" value="${escapeAttr(item.periodo||'')}"></div>
      </div>
    `;
    list.appendChild(block);
  });
  attachItemHandlers('courses');
}

function attachItemHandlers(type){
  const containerId = type==='exp' ? 'expList' : (type==='edu' ? 'eduList' : 'courseList');
  const container = document.getElementById(containerId);
  container.querySelectorAll('input,textarea').forEach(el=>{
    el.addEventListener('input', ()=>{
      const idx = parseInt(el.dataset.idx);
      const field = el.dataset.field;
      data[type][idx][field] = el.value;
      save();
    });
  });
  container.querySelectorAll('.remove').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const idx = parseInt(btn.dataset.idx);
      data[type].splice(idx,1);
      if(type==='exp') renderExpForm();
      else if(type==='edu') renderEduForm();
      else renderCourseForm();
      save();
    });
  });
}

document.getElementById('addExp').addEventListener('click', ()=>{
  data.exp.push({cargo:'',empresa:'',periodo:'',descricao:''});
  renderExpForm(); save();
});
document.getElementById('addEdu').addEventListener('click', ()=>{
  data.edu.push({curso:'',instituicao:'',periodo:''});
  renderEduForm(); save();
});
document.getElementById('addCourse').addEventListener('click', ()=>{
  data.courses.push({nome:'',instituicao:'',periodo:''});
  renderCourseForm(); save();
});

// ---------- Skills & Languages ----------
window.addSkill = function(){
  const input = document.getElementById('skillInput');
  const val = input.value.trim();
  if(!val) return;
  data.skills.push(val);
  input.value='';
  renderTags('skills','skillTags'); save();
};
window.addLang = function(){
  const input = document.getElementById('langInput');
  const val = input.value.trim();
  if(!val) return;
  data.langs.push(val);
  input.value='';
  renderTags('langs','langTags'); save();
};

function renderTags(field, containerId){
  const container = document.getElementById(containerId);
  container.innerHTML='';
  data[field].forEach((val, idx)=>{
    const tag = document.createElement('div');
    tag.className='tag';
    tag.innerHTML = `<span>${escapeHtml(val)}</span><button data-idx="${idx}">✕</button>`;
    tag.querySelector('button').addEventListener('click', ()=>{
      data[field].splice(idx,1);
      renderTags(field, containerId); save();
    });
    container.appendChild(tag);
  });
}

// ---------- Preview ----------
function renderPreview(){
  document.getElementById('p_nome').textContent = data.nome || 'Seu Nome';
  const cargoEl = document.getElementById('p_cargo');
  if(data.cargo){ cargoEl.style.display=''; cargoEl.textContent = data.cargo; }
  else cargoEl.style.display='none';

  const contacts = [];
  if(data.idade) contacts.push(data.idade+' anos');
  if(data.email) contacts.push('✉ '+data.email);
  if(data.telefone) contacts.push('📞 '+data.telefone);
  if(data.local) contacts.push('📍 '+data.local);
  if(data.link) contacts.push('🔗 '+data.link);
  if(data.cnh) contacts.push('CNH: '+data.cnh);
  if(data.escolaridade) contacts.push(data.escolaridade);
  document.getElementById('p_contacts').innerHTML = contacts.map(c=>`<span>${escapeHtml(c)}</span>`).join('');

  const resumoSec = document.getElementById('p_resumoSection');
  if(data.resumo){ resumoSec.style.display=''; document.getElementById('p_resumo').textContent = data.resumo; }
  else resumoSec.style.display='none';

  const expSec = document.getElementById('p_expSection');
  const expList = document.getElementById('p_expList');
  if(data.exp.length>0){
    expSec.style.display='';
    expList.innerHTML = data.exp.map(e=>`
      <div class="entry">
        <div class="row"><span>${escapeHtml(e.cargo||'')}</span><span>${escapeHtml(e.periodo||'')}</span></div>
        <div class="sub">${escapeHtml(e.empresa||'')}</div>
        ${e.descricao ? `<p>${escapeHtml(e.descricao)}</p>` : ''}
      </div>`).join('');
  } else expSec.style.display='none';

  const eduSec = document.getElementById('p_eduSection');
  const eduList = document.getElementById('p_eduList');
  if(data.edu.length>0){
    eduSec.style.display='';
    eduList.innerHTML = data.edu.map(e=>`
      <div class="entry">
        <div class="row"><span>${escapeHtml(e.curso||'')}</span><span>${escapeHtml(e.periodo||'')}</span></div>
        <div class="sub">${escapeHtml(e.instituicao||'')}</div>
      </div>`).join('');
  } else eduSec.style.display='none';

  const courseSec = document.getElementById('p_courseSection');
  const courseList = document.getElementById('p_courseList');
  if(data.courses.length>0){
    courseSec.style.display='';
    courseList.innerHTML = data.courses.map(c=>`
      <div class="entry">
        <div class="row"><span>${escapeHtml(c.nome||'')}</span><span>${escapeHtml(c.periodo||'')}</span></div>
        <div class="sub">${escapeHtml(c.instituicao||'')}</div>
      </div>`).join('');
  } else courseSec.style.display='none';

  const skillSec = document.getElementById('p_skillSection');
  if(data.skills.length>0){
    skillSec.style.display='';
    document.getElementById('p_skillTags').innerHTML = data.skills.map(s=>`<span>${escapeHtml(s)}</span>`).join('');
  } else skillSec.style.display='none';

  const langSec = document.getElementById('p_langSection');
  if(data.langs.length>0){
    langSec.style.display='';
    document.getElementById('p_langTags').innerHTML = data.langs.map(s=>`<span>${escapeHtml(s)}</span>`).join('');
  } else langSec.style.display='none';
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML.replace(/\n/g,'<br>');
}
function escapeAttr(str){
  return String(str).replace(/"/g,'&quot;');
}

// ---------- Init render ----------
renderExpForm();
renderEduForm();
renderCourseForm();
renderTags('skills','skillTags');
renderTags('langs','langTags');
renderPreview();

// ---------- Clear ----------
document.getElementById('clearBtn').addEventListener('click', ()=>{
  if(confirm('Tem certeza que deseja limpar todos os dados do currículo?')){
    data = {nome:'',cargo:'',email:'',telefone:'',local:'',link:'',idade:'',cnh:'',escolaridade:'',resumo:'',exp:[],edu:[],courses:[],skills:[],langs:[]};
    personalIds.forEach(id=>{ document.getElementById('f_'+id).value=''; });
    renderExpForm(); renderEduForm(); renderCourseForm();
    renderTags('skills','skillTags'); renderTags('langs','langTags');
    save();
  }
});

// ---------- Export PDF ----------
document.getElementById('exportBtn').addEventListener('click', async ()=>{
  const btn = document.getElementById('exportBtn');
  const originalText = btn.innerHTML;
  btn.innerHTML = '⏳ Gerando...';
  btn.disabled = true;
  try{
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('p','mm','a4');
    const el = document.getElementById('cvPage');
    await pdf.html(el, {
      callback: function(doc){
        const filename = (data.nome ? data.nome.replace(/\s+/g,'_') : 'curriculo') + '.pdf';
        doc.save(filename);
        btn.innerHTML = originalText;
        btn.disabled = false;
      },
      x:0, y:0,
      width: 210,
      windowWidth: el.scrollWidth,
      autoPaging: 'text'
    });
  }catch(err){
    console.error(err);
    alert('Erro ao gerar PDF. Tente novamente.');
    btn.innerHTML = originalText;
    btn.disabled = false;
  }
});

// ---------- Service worker ----------
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}

// ---------- Install prompt ----------
let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('installBanner').classList.add('show');
});
document.getElementById('installBtn').addEventListener('click', async ()=>{
  if(!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  document.getElementById('installBanner').classList.remove('show');
});
window.addEventListener('appinstalled', ()=>{
  document.getElementById('installBanner').classList.remove('show');
});
</script>
</body>
</html>
